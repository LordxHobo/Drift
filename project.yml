name: Drift
options:
  bundleIdPrefix: com.lordxhobo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: 0.4.9
targets:
  Drift:
    type: application
    platform: iOS
    sources:
      - path: Drift
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: YouTubeKit
      - target: DriftLyrics
    settings:
      base:
        PRODUCT_NAME: Drift
        PRODUCT_BUNDLE_IDENTIFIER: com.lordxhobo.drift
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Apple Music style's icon (switched to when that style is picked).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Music
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_FILE: Drift/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
    scheme: {}

  # Live Activity (lock screen, Dynamic Island, CarPlay on iOS 26) with the current lyric line.
  DriftLyrics:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DriftLyrics
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: DriftLyrics
        PRODUCT_BUNDLE_IDENTIFIER: com.lordxhobo.drift.lyrics
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: DriftLyrics/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
