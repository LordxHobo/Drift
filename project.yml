name: Drift
options:
  bundleIdPrefix: com.lordxhobo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: 0.4.9
targets:
  Drift:
    type: application
    platform: iOS
    sources:
      - path: Drift
        excludes:
          - Info.plist
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_NAME: Drift
        PRODUCT_BUNDLE_IDENTIFIER: com.lordxhobo.drift
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Drift/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
    scheme: {}
