name: Desktop

# Builds Drift for Windows and Linux when the desktop app changes. The Mac build runs when started by
# hand (Actions → Desktop → Run workflow), since Mac minutes cost more.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      mac:
        description: 'Also build for Mac'
        type: boolean
        default: false

defaults:
  run:
    working-directory: desktop
    shell: bash

# Each build gets its own version (0.1.<build number>) so installed copies see it as an update.
# With the RELEASES_TOKEN secret set, builds are published to LordxHobo/drift-releases, where Drift
# looks for updates. Without it, they're only kept as downloads on the run's page.
env:
  GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      # Create the release first (once), so the uploads below don't race to create it.
      - name: Prepare the release
        if: env.GH_TOKEN != ''
        run: |
          V="0.1.${{ github.run_number }}"
          R="LordxHobo/drift-releases"
          if ! gh release view "v$V" --repo "$R" >/dev/null 2>&1; then
            gh release create "v$V" --repo "$R" --title "Drift $V" --notes "Drift $V for Windows and Linux." \
              || { echo "::error::Couldn't create the release. drift-releases needs at least one commit (for example a README)."; exit 1; }
          fi
      - name: Build the installer
        run: npx electron-vite build && npx electron-builder --win --publish "$([ -n "$GH_TOKEN" ] && echo always || echo never)"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: drift-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  linux:
    # After Windows, so both don't try to create the same release at once.
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      - run: npx electron-vite build && npx electron-builder --linux --publish "$([ -n "$GH_TOKEN" ] && echo always || echo never)"
      - uses: actions/upload-artifact@v4
        with:
          name: drift-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  mac:
    if: github.event_name == 'workflow_dispatch' && inputs.mac
    needs: windows
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      - run: npx electron-vite build && npx electron-builder --mac --publish "$([ -n "$GH_TOKEN" ] && echo always || echo never)"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: drift-mac
          path: desktop/dist/*.dmg
          if-no-files-found: error
