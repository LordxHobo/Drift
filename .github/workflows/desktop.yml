name: Desktop

# Builds Drift for Windows and Linux when the desktop app changes. The Mac build runs when started by
# hand (Actions → Desktop → Run workflow), since Mac minutes cost more.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      mac:
        description: 'Also build for Mac'
        type: boolean
        default: false

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Build the installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: drift-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: drift-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  mac:
    if: github.event_name == 'workflow_dispatch' && inputs.mac
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: drift-mac
          path: desktop/dist/*.dmg
          if-no-files-found: error
