name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Nightjar.xcodeproj \
            -scheme Nightjar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Nightjar/|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Nightjar.app

      - name: Show errors
        if: failure()
        run: grep -E "error:" -A3 build.log | head -100 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nightjar.app Payload/
          zip -qry nightjar-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: nightjar-ios
          path: nightjar-unsigned.ipa
