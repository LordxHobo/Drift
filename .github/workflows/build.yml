name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26 if available (needed for the glass effects)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          status=0
          xcodebuild \
            -project Drift.xcodeproj \
            -scheme Drift \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > build.log 2>&1 || status=$?
          grep -E "\*\* BUILD" build.log || true
          # Fail (red) on any compile error, and never package a half-built app.
          if [ "$status" -ne 0 ] || ! grep -q "BUILD SUCCEEDED" build.log; then
            echo "Build failed"
            exit 1
          fi
          test -f build/Build/Products/Release-iphoneos/Drift.app/Info.plist
          test -f build/Build/Products/Release-iphoneos/Drift.app/Drift

      - name: Show errors
        if: failure()
        run: grep -E "error:" -A3 build.log | grep -v "^--$" | head -120 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Drift.app Payload/
          zip -qry drift-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: drift-ios
          path: drift-unsigned.ipa
