name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # The phone shows What's new from the shared notes.
      - 'desktop/src/shared/patchNotes.json'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # The same key every build, so updates install over the old app. Without it, a debug key is used.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/drift.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/drift.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, so this build is signed with a throwaway key and won't update an installed Drift."
          fi

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace > build.log 2>&1 || { tail -150 build.log; exit 1; }
          tail -5 build.log
          cp app/build/outputs/apk/release/app-release.apk "../drift-${{ github.run_number }}.apk"

      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A4 build.log | head -150 || true

      - uses: actions/upload-artifact@v4
        with:
          name: drift-android
          path: drift-${{ github.run_number }}.apk
